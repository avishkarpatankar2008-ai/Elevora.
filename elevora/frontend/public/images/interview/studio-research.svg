<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <radialGradient id="bg-grad-studio-research" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1d26" />
      <stop offset="100%" stop-color="#0d0c11" />
    </radialGradient>
    <linearGradient id="accent-grad-studio-research" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3cff" />
      <stop offset="100%" stop-color="#4deeea" />
    </linearGradient>
    <filter id="glow-studio-research" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-studio-research)" />

  <!-- Grid mesh pattern -->
  <g stroke="rgba(239, 238, 244, 0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="900" y2="0" /><line x1="0" y1="100" x2="900" y2="100" /><line x1="0" y1="200" x2="900" y2="200" /><line x1="0" y1="300" x2="900" y2="300" /><line x1="0" y1="400" x2="900" y2="400" /><line x1="0" y1="500" x2="900" y2="500" /><line x1="0" y1="600" x2="900" y2="600" /><line x1="0" y1="700" x2="900" y2="700" /><line x1="0" y1="800" x2="900" y2="800" /><line x1="0" y1="900" x2="900" y2="900" /><line x1="0" y1="1000" x2="900" y2="1000" /><line x1="0" y1="1100" x2="900" y2="1100" />
    <line x1="0" y1="0" x2="0" y2="1200" /><line x1="56.25" y1="0" x2="56.25" y2="1200" /><line x1="112.5" y1="0" x2="112.5" y2="1200" /><line x1="168.75" y1="0" x2="168.75" y2="1200" /><line x1="225" y1="0" x2="225" y2="1200" /><line x1="281.25" y1="0" x2="281.25" y2="1200" /><line x1="337.5" y1="0" x2="337.5" y2="1200" /><line x1="393.75" y1="0" x2="393.75" y2="1200" /><line x1="450" y1="0" x2="450" y2="1200" /><line x1="506.25" y1="0" x2="506.25" y2="1200" /><line x1="562.5" y1="0" x2="562.5" y2="1200" /><line x1="618.75" y1="0" x2="618.75" y2="1200" /><line x1="675" y1="0" x2="675" y2="1200" /><line x1="731.25" y1="0" x2="731.25" y2="1200" /><line x1="787.5" y1="0" x2="787.5" y2="1200" /><line x1="843.75" y1="0" x2="843.75" y2="1200" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="630" cy="420" r="252.00000000000003" fill="url(#accent-grad-studio-research)" opacity="0.18" filter="url(#glow-studio-research)" />
  <circle cx="270" cy="780" r="198" fill="#6c3cff" opacity="0.22" filter="url(#glow-studio-research)" />

  <!-- Abstract Geometry representing AI / Interview -->
  <g transform="translate(450, 540)">
    <!-- Soundwave / Speech node visualization -->
    <path d="M -225 0 Q -112.5 -40, 0 0 T 225 0" fill="none" stroke="url(#accent-grad-studio-research)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M -180 20 Q -90 -20, 0 20 T 180 20" fill="none" stroke="#6c3cff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#efeef4" filter="url(#glow-studio-research)" />
    <circle cx="-112.5" cy="-20" r="5" fill="#6c3cff" />
    <circle cx="112.5" cy="-20" r="5" fill="#4deeea" />
  </g>

  <!-- Typography / Info Badge -->
  <g transform="translate(36, 1140)">
    <rect x="-8" y="-22" width="74" height="30" rx="15" fill="rgba(108, 60, 255, 0.25)" stroke="#6c3cff" stroke-width="1" />
    <text x="2" y="-2" fill="#efeef4" font-family="'Onest', sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">METHOD</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Gabarito', sans-serif" font-size="24" font-weight="700">Grounding Verification</text>
  </g>
</svg>