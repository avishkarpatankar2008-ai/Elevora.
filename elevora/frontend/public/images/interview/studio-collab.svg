<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" width="1400" height="933">
  <defs>
    <radialGradient id="bg-grad-studio-collab" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1d26" />
      <stop offset="100%" stop-color="#0d0c11" />
    </radialGradient>
    <linearGradient id="accent-grad-studio-collab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3cff" />
      <stop offset="100%" stop-color="#4deeea" />
    </linearGradient>
    <filter id="glow-studio-collab" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-studio-collab)" />

  <!-- Grid mesh pattern -->
  <g stroke="rgba(239, 238, 244, 0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="1400" y2="0" /><line x1="0" y1="77.75" x2="1400" y2="77.75" /><line x1="0" y1="155.5" x2="1400" y2="155.5" /><line x1="0" y1="233.25" x2="1400" y2="233.25" /><line x1="0" y1="311" x2="1400" y2="311" /><line x1="0" y1="388.75" x2="1400" y2="388.75" /><line x1="0" y1="466.5" x2="1400" y2="466.5" /><line x1="0" y1="544.25" x2="1400" y2="544.25" /><line x1="0" y1="622" x2="1400" y2="622" /><line x1="0" y1="699.75" x2="1400" y2="699.75" /><line x1="0" y1="777.5" x2="1400" y2="777.5" /><line x1="0" y1="855.25" x2="1400" y2="855.25" />
    <line x1="0" y1="0" x2="0" y2="933" /><line x1="87.5" y1="0" x2="87.5" y2="933" /><line x1="175" y1="0" x2="175" y2="933" /><line x1="262.5" y1="0" x2="262.5" y2="933" /><line x1="350" y1="0" x2="350" y2="933" /><line x1="437.5" y1="0" x2="437.5" y2="933" /><line x1="525" y1="0" x2="525" y2="933" /><line x1="612.5" y1="0" x2="612.5" y2="933" /><line x1="700" y1="0" x2="700" y2="933" /><line x1="787.5" y1="0" x2="787.5" y2="933" /><line x1="875" y1="0" x2="875" y2="933" /><line x1="962.5" y1="0" x2="962.5" y2="933" /><line x1="1050" y1="0" x2="1050" y2="933" /><line x1="1137.5" y1="0" x2="1137.5" y2="933" /><line x1="1225" y1="0" x2="1225" y2="933" /><line x1="1312.5" y1="0" x2="1312.5" y2="933" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="979.9999999999999" cy="326.54999999999995" r="261.24" fill="url(#accent-grad-studio-collab)" opacity="0.18" filter="url(#glow-studio-collab)" />
  <circle cx="420" cy="606.45" r="205.26" fill="#6c3cff" opacity="0.22" filter="url(#glow-studio-collab)" />

  <!-- Abstract Geometry representing AI / Interview -->
  <g transform="translate(700, 419.85)">
    <!-- Soundwave / Speech node visualization -->
    <path d="M -350 0 Q -175 -40, 0 0 T 350 0" fill="none" stroke="url(#accent-grad-studio-collab)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M -280 20 Q -140 -20, 0 20 T 280 20" fill="none" stroke="#6c3cff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#efeef4" filter="url(#glow-studio-collab)" />
    <circle cx="-175" cy="-20" r="5" fill="#6c3cff" />
    <circle cx="175" cy="-20" r="5" fill="#4deeea" />
  </g>

  <!-- Typography / Info Badge -->
  <g transform="translate(36, 873)">
    <rect x="-8" y="-22" width="92" height="30" rx="15" fill="rgba(108, 60, 255, 0.25)" stroke="#6c3cff" stroke-width="1" />
    <text x="2" y="-2" fill="#efeef4" font-family="'Onest', sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">SECURITY</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Gabarito', sans-serif" font-size="24" font-weight="700">Privacy First</text>
  </g>
</svg>