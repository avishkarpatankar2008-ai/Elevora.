<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="bg-grad-hero-aperture" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1d26" />
      <stop offset="100%" stop-color="#0d0c11" />
    </radialGradient>
    <linearGradient id="accent-grad-hero-aperture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3cff" />
      <stop offset="100%" stop-color="#4deeea" />
    </linearGradient>
    <filter id="glow-hero-aperture" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-hero-aperture)" />

  <!-- Grid mesh pattern -->
  <g stroke="rgba(239, 238, 244, 0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="100" x2="1200" y2="100" /><line x1="0" y1="200" x2="1200" y2="200" /><line x1="0" y1="300" x2="1200" y2="300" /><line x1="0" y1="400" x2="1200" y2="400" /><line x1="0" y1="500" x2="1200" y2="500" /><line x1="0" y1="600" x2="1200" y2="600" /><line x1="0" y1="700" x2="1200" y2="700" /><line x1="0" y1="800" x2="1200" y2="800" /><line x1="0" y1="900" x2="1200" y2="900" /><line x1="0" y1="1000" x2="1200" y2="1000" /><line x1="0" y1="1100" x2="1200" y2="1100" />
    <line x1="0" y1="0" x2="0" y2="1200" /><line x1="75" y1="0" x2="75" y2="1200" /><line x1="150" y1="0" x2="150" y2="1200" /><line x1="225" y1="0" x2="225" y2="1200" /><line x1="300" y1="0" x2="300" y2="1200" /><line x1="375" y1="0" x2="375" y2="1200" /><line x1="450" y1="0" x2="450" y2="1200" /><line x1="525" y1="0" x2="525" y2="1200" /><line x1="600" y1="0" x2="600" y2="1200" /><line x1="675" y1="0" x2="675" y2="1200" /><line x1="750" y1="0" x2="750" y2="1200" /><line x1="825" y1="0" x2="825" y2="1200" /><line x1="900" y1="0" x2="900" y2="1200" /><line x1="975" y1="0" x2="975" y2="1200" /><line x1="1050" y1="0" x2="1050" y2="1200" /><line x1="1125" y1="0" x2="1125" y2="1200" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="840" cy="420" r="336.00000000000006" fill="url(#accent-grad-hero-aperture)" opacity="0.18" filter="url(#glow-hero-aperture)" />
  <circle cx="360" cy="780" r="264" fill="#6c3cff" opacity="0.22" filter="url(#glow-hero-aperture)" />

  <!-- Abstract Geometry representing AI / Interview -->
  <g transform="translate(600, 540)">
    <!-- Soundwave / Speech node visualization -->
    <path d="M -300 0 Q -150 -40, 0 0 T 300 0" fill="none" stroke="url(#accent-grad-hero-aperture)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M -240 20 Q -120 -20, 0 20 T 240 20" fill="none" stroke="#6c3cff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#efeef4" filter="url(#glow-hero-aperture)" />
    <circle cx="-150" cy="-20" r="5" fill="#6c3cff" />
    <circle cx="150" cy="-20" r="5" fill="#4deeea" />
  </g>

  <!-- Typography / Info Badge -->
  <g transform="translate(36, 1140)">
    <rect x="-8" y="-22" width="83" height="30" rx="15" fill="rgba(108, 60, 255, 0.25)" stroke="#6c3cff" stroke-width="1" />
    <text x="2" y="-2" fill="#efeef4" font-family="'Onest', sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">AI CORE</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Gabarito', sans-serif" font-size="24" font-weight="700">Adaptive Engine</text>
  </g>
</svg>