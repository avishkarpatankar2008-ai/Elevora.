<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <radialGradient id="bg-grad-journal-guide-4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1d26" />
      <stop offset="100%" stop-color="#0d0c11" />
    </radialGradient>
    <linearGradient id="accent-grad-journal-guide-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3cff" />
      <stop offset="100%" stop-color="#4deeea" />
    </linearGradient>
    <filter id="glow-journal-guide-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-journal-guide-4)" />

  <!-- Grid mesh pattern -->
  <g stroke="rgba(239, 238, 244, 0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="1000" y2="0" /><line x1="0" y1="104.16666666666667" x2="1000" y2="104.16666666666667" /><line x1="0" y1="208.33333333333334" x2="1000" y2="208.33333333333334" /><line x1="0" y1="312.5" x2="1000" y2="312.5" /><line x1="0" y1="416.6666666666667" x2="1000" y2="416.6666666666667" /><line x1="0" y1="520.8333333333334" x2="1000" y2="520.8333333333334" /><line x1="0" y1="625" x2="1000" y2="625" /><line x1="0" y1="729.1666666666667" x2="1000" y2="729.1666666666667" /><line x1="0" y1="833.3333333333334" x2="1000" y2="833.3333333333334" /><line x1="0" y1="937.5" x2="1000" y2="937.5" /><line x1="0" y1="1041.6666666666667" x2="1000" y2="1041.6666666666667" /><line x1="0" y1="1145.8333333333335" x2="1000" y2="1145.8333333333335" />
    <line x1="0" y1="0" x2="0" y2="1250" /><line x1="62.5" y1="0" x2="62.5" y2="1250" /><line x1="125" y1="0" x2="125" y2="1250" /><line x1="187.5" y1="0" x2="187.5" y2="1250" /><line x1="250" y1="0" x2="250" y2="1250" /><line x1="312.5" y1="0" x2="312.5" y2="1250" /><line x1="375" y1="0" x2="375" y2="1250" /><line x1="437.5" y1="0" x2="437.5" y2="1250" /><line x1="500" y1="0" x2="500" y2="1250" /><line x1="562.5" y1="0" x2="562.5" y2="1250" /><line x1="625" y1="0" x2="625" y2="1250" /><line x1="687.5" y1="0" x2="687.5" y2="1250" /><line x1="750" y1="0" x2="750" y2="1250" /><line x1="812.5" y1="0" x2="812.5" y2="1250" /><line x1="875" y1="0" x2="875" y2="1250" /><line x1="937.5" y1="0" x2="937.5" y2="1250" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="700" cy="437.5" r="280" fill="url(#accent-grad-journal-guide-4)" opacity="0.18" filter="url(#glow-journal-guide-4)" />
  <circle cx="300" cy="812.5" r="220" fill="#6c3cff" opacity="0.22" filter="url(#glow-journal-guide-4)" />

  <!-- Abstract Geometry representing AI / Interview -->
  <g transform="translate(500, 562.5)">
    <!-- Soundwave / Speech node visualization -->
    <path d="M -250 0 Q -125 -40, 0 0 T 250 0" fill="none" stroke="url(#accent-grad-journal-guide-4)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M -200 20 Q -100 -20, 0 20 T 200 20" fill="none" stroke="#6c3cff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#efeef4" filter="url(#glow-journal-guide-4)" />
    <circle cx="-125" cy="-20" r="5" fill="#6c3cff" />
    <circle cx="125" cy="-20" r="5" fill="#4deeea" />
  </g>

  <!-- Typography / Info Badge -->
  <g transform="translate(36, 1190)">
    <rect x="-8" y="-22" width="83" height="30" rx="15" fill="rgba(108, 60, 255, 0.25)" stroke="#6c3cff" stroke-width="1" />
    <text x="2" y="-2" fill="#efeef4" font-family="'Onest', sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">POSTURE</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Gabarito', sans-serif" font-size="24" font-weight="700">Body Language Context</text>
  </g>
</svg>