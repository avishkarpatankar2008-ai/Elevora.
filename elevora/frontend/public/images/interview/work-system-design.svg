<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="bg-grad-work-system-design" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1d26" />
      <stop offset="100%" stop-color="#0d0c11" />
    </radialGradient>
    <linearGradient id="accent-grad-work-system-design" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3cff" />
      <stop offset="100%" stop-color="#4deeea" />
    </linearGradient>
    <filter id="glow-work-system-design" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-work-system-design)" />

  <!-- Grid mesh pattern -->
  <g stroke="rgba(239, 238, 244, 0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="1600" y2="0" /><line x1="0" y1="83.33333333333333" x2="1600" y2="83.33333333333333" /><line x1="0" y1="166.66666666666666" x2="1600" y2="166.66666666666666" /><line x1="0" y1="250" x2="1600" y2="250" /><line x1="0" y1="333.3333333333333" x2="1600" y2="333.3333333333333" /><line x1="0" y1="416.66666666666663" x2="1600" y2="416.66666666666663" /><line x1="0" y1="500" x2="1600" y2="500" /><line x1="0" y1="583.3333333333333" x2="1600" y2="583.3333333333333" /><line x1="0" y1="666.6666666666666" x2="1600" y2="666.6666666666666" /><line x1="0" y1="750" x2="1600" y2="750" /><line x1="0" y1="833.3333333333333" x2="1600" y2="833.3333333333333" /><line x1="0" y1="916.6666666666666" x2="1600" y2="916.6666666666666" />
    <line x1="0" y1="0" x2="0" y2="1000" /><line x1="100" y1="0" x2="100" y2="1000" /><line x1="200" y1="0" x2="200" y2="1000" /><line x1="300" y1="0" x2="300" y2="1000" /><line x1="400" y1="0" x2="400" y2="1000" /><line x1="500" y1="0" x2="500" y2="1000" /><line x1="600" y1="0" x2="600" y2="1000" /><line x1="700" y1="0" x2="700" y2="1000" /><line x1="800" y1="0" x2="800" y2="1000" /><line x1="900" y1="0" x2="900" y2="1000" /><line x1="1000" y1="0" x2="1000" y2="1000" /><line x1="1100" y1="0" x2="1100" y2="1000" /><line x1="1200" y1="0" x2="1200" y2="1000" /><line x1="1300" y1="0" x2="1300" y2="1000" /><line x1="1400" y1="0" x2="1400" y2="1000" /><line x1="1500" y1="0" x2="1500" y2="1000" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="1120" cy="350" r="280" fill="url(#accent-grad-work-system-design)" opacity="0.18" filter="url(#glow-work-system-design)" />
  <circle cx="480" cy="650" r="220" fill="#6c3cff" opacity="0.22" filter="url(#glow-work-system-design)" />

  <!-- Abstract Geometry representing AI / Interview -->
  <g transform="translate(800, 450)">
    <!-- Soundwave / Speech node visualization -->
    <path d="M -400 0 Q -200 -40, 0 0 T 400 0" fill="none" stroke="url(#accent-grad-work-system-design)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M -320 20 Q -160 -20, 0 20 T 320 20" fill="none" stroke="#6c3cff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#efeef4" filter="url(#glow-work-system-design)" />
    <circle cx="-200" cy="-20" r="5" fill="#6c3cff" />
    <circle cx="200" cy="-20" r="5" fill="#4deeea" />
  </g>

  <!-- Typography / Info Badge -->
  <g transform="translate(36, 940)">
    <rect x="-8" y="-22" width="74" height="30" rx="15" fill="rgba(108, 60, 255, 0.25)" stroke="#6c3cff" stroke-width="1" />
    <text x="2" y="-2" fill="#efeef4" font-family="'Onest', sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">DESIGN</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Gabarito', sans-serif" font-size="24" font-weight="700">System Architecture</text>
  </g>
</svg>